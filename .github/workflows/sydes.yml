name: Sydes

# Sydes runs as an independent PR check alongside the repository's existing
# CI. All implementation lives in the reusable workflow — see
# https://github.com/sydes-examples/.github for the workflow, renderer, and
# the frozen v1 presentation contract this repo relies on.

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  sydes:
    uses: sydes-examples/sydes-action/.github/workflows/verify.yml@v2
    with:
      repo_alias: app
      model: openai:gpt-5.6-sol
      run_tests: true
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
